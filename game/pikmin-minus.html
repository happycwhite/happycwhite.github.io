<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f2e8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="帶著皮克敏練習減法，算出還差幾隻才能把怪物壓扁！" />
  <title>皮克敏減法大作戰</title>
  <style>
    :root { color-scheme: light; --ink:#26362b; --green:#426b43; --leaf:#8cae70; --paper:#f5f2e8; --sun:#f0bd4f; --red:#e65545; --muted:#748074; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(ellipse at 50% -15%,#fffdf7 0%,var(--paper) 57%,#e9eddb 100%); font-family:ui-rounded,"Noto Sans TC","PingFang TC",system-ui,sans-serif; }
    button,input { font:inherit; }
    .page { width:min(1080px,100%); margin:auto; padding:22px 24px 28px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:18px; margin-bottom:17px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:47px;height:47px;display:grid;place-items:center;background:#dce9cb;border:2px solid #c6d7af;border-radius:16px;font-size:27px;transform:rotate(-5deg); }
    .eyebrow { margin:0 0 2px; color:var(--green); font-weight:850; font-size:12px; letter-spacing:.15em; }
    h1 { margin:0; font-size:clamp(21px,4vw,31px); line-height:1.12; letter-spacing:-.045em; }
    .score { display:flex;align-items:center;gap:9px;padding:9px 15px;background:#fffdf8;border:1px solid #e8e2d4;border-radius:999px;font-weight:850;white-space:nowrap;box-shadow:0 3px 9px #4556310b; }
    .score b { color:#c58a20;font-variant-numeric:tabular-nums; }
    .intro { margin:0 0 16px 3px;color:#637064;font-size:14px; }
    .game { overflow:hidden; position:relative; border:1px solid #d9ddc9; border-radius:27px; background:#fbfaf3; box-shadow:0 18px 48px #4b61341a,0 3px 9px #4b61340a; }
    .playfield { height:clamp(330px,47vw,455px); min-height:330px; position:relative; overflow:hidden; background:linear-gradient(180deg,#dcefd8 0%,#eaf2d9 64%,#d8e7bd 64.2%,#c3d59f 100%); transition:height .22s ease; }
    .sunlight { position:absolute;width:280px;height:280px;top:-150px;right:10%;border-radius:50%;background:#fff8cb;opacity:.65;filter:blur(2px); }
    .cloud { position:absolute;top:53px;left:12%;width:82px;height:26px;border-radius:30px;background:#ffffff85; }
    .cloud:before,.cloud:after { content:"";position:absolute;bottom:0;background:inherit;border-radius:50%; }
    .cloud:before {width:35px;height:35px;left:12px}.cloud:after {width:29px;height:29px;left:39px}
    .cloud.two { top:90px;left:auto;right:21%;transform:scale(.7);opacity:.7; }
    .hill {position:absolute;bottom:74px;width:390px;height:130px;border-radius:50% 50% 0 0;background:#aaca88;opacity:.58;}
    .hill.left {left:-120px;transform:rotate(-9deg)} .hill.right {right:-130px;bottom:61px;background:#b7d391;transform:rotate(9deg)}
    .ground {position:absolute;left:0;right:0;bottom:0;height:79px;background:linear-gradient(#90b16b,#7f9e58);border-top:5px solid #b9cf8f;}
    .ground:after {content:"";position:absolute;inset:16px 0 auto;height:2px;background:#ffffff30;}
    .flower {position:absolute;bottom:75px;font-size:21px;filter:saturate(.85);z-index:2}.f1{left:8%}.f2{left:23%;bottom:79px}.f3{right:13%;bottom:82px}.f4{right:27%;font-size:16px}
    .scene-label {position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:7px 12px;background:#ffffffb9;border:1px solid #ffffffb8;border-radius:999px;color:#536a4d;font-weight:800;font-size:12px;white-space:nowrap;}
    .target-pill { width:7px;height:7px;border-radius:50%;background:#e0aa35;box-shadow:0 0 0 3px #f3dda4; }
    .monster-wrap {position:absolute;left:50%;bottom:69px;transform:translateX(-50%);width:clamp(154px,21vw,215px);height:205px;display:flex;align-items:flex-end;justify-content:center;z-index:3;transition:transform .75s cubic-bezier(.2,.8,.2,1),filter .5s,width .22s ease,height .22s ease,bottom .22s ease;}
    .monster {max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 12px 5px #43502e2b);transition:transform .7s cubic-bezier(.2,.8,.2,1),filter .6s;transform-origin:50% 100%;}
    .monster-number {position:absolute;top:3px;right:-11px;min-width:46px;height:46px;padding:0 9px;display:grid;place-items:center;background:#fffdf2;border:3px solid #f0c962;border-radius:50%;font-weight:950;font-size:22px;color:#965b31;box-shadow:0 3px 0 #c68b39;transition:opacity .3s;}
    .crew {position:absolute;left:50%;bottom:90px;transform:translateX(-50%);display:block;width:min(calc(100vw - 36px),470px);height:205px;z-index:4;pointer-events:none;transition:bottom .45s ease,width .22s ease,height .22s ease;}
    .pikmin {position:absolute;width:clamp(58px,7vw,78px);height:clamp(82px,10vw,115px);object-fit:contain;filter:drop-shadow(0 4px 2px #27351e35);animation:bob 1.8s ease-in-out infinite;animation-delay:calc(var(--i)*-0.13s);transition:transform .8s cubic-bezier(.18,.8,.25,1),opacity .5s;}
    @keyframes bob {0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
    .equation-card {position:absolute;top:77px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:11px;padding:11px 17px;background:#fffdf7e8;border:1px solid #ffffff;border-radius:19px;box-shadow:0 8px 24px #42543c19;white-space:nowrap;z-index:5;transition:top .22s ease,gap .22s ease;}
    .equation-card .num {min-width:38px;text-align:center;font-size:clamp(23px,4vw,35px);font-weight:950;letter-spacing:-.06em;font-variant-numeric:tabular-nums;}
    .equation-card .minus {font-size:22px;color:#a2aa9c;font-weight:600;}
    .equation-card .blank {width:48px;min-width:48px;height:48px;padding:0 3px;border:2px dashed #a3bb88;border-radius:12px;background:#f6faee;color:var(--green);text-align:center;font-size:28px;font-weight:900;outline:none;transition:width .22s ease,min-width .22s ease,border-color .18s,box-shadow .18s;}
    .equation-card .blank:focus {border-style:solid;border-color:#67924f;box-shadow:0 0 0 4px #9ac78042;}
    .equation-card .blank:disabled {background:#eaf2dd;border-style:solid;}
    .feedback {position:absolute;top:186px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:#fffdf2;color:#486c3d;font-size:13px;font-weight:850;white-space:nowrap;z-index:8;opacity:0;transition:opacity .2s;}
    .feedback.show {opacity:1}.feedback.wrong{color:#a84c3d;background:#fff0e9}
    .run .pikmin {animation:none;transform:translateY(58px) scale(.86);opacity:.35;}
    .run .monster-wrap {transform:translateX(-50%) translateY(75px) scaleY(.38);filter:brightness(.9);}
    .run .monster {transform:rotate(180deg);filter:drop-shadow(0 4px 2px #43502e35);}
    .run .monster-number {opacity:0;}
    .run .ground {background:linear-gradient(#8ca963,#79934e)}
    .wrong-state .crew {bottom:79px;}
    .wrong-state .pikmin {animation:none;left:var(--ground-x)!important;top:calc(100% - 68px)!important;transform:translateY(14px) rotate(90deg);transform-origin:center;}
    .keypad {display:none;}
    .controls {display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:18px 21px 20px;background:#fffdf8;}
    .left-controls {display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
    .target-control {display:flex;align-items:center;gap:8px;color:#667166;font-size:13px;font-weight:750;}
    .type-picker {display:flex;align-items:center;gap:7px;color:#667166;font-size:12px;font-weight:750;}
    .type-picker-title {margin-right:1px;}
    .type-picker-button {display:flex;align-items:center;gap:8px;min-height:42px;padding:6px 11px;border:1px solid #e1e2d7;border-radius:12px;background:#fffdf8;color:#596653;font-size:12px;font-weight:800;cursor:pointer;}
    .type-picker-button:hover {border-color:#b8c9a8;background:#f8faef;}
    .type-picker-icons {display:flex;align-items:center;}
    .type-picker-icons img {width:25px;height:28px;object-fit:contain;margin-left:-4px;}
    .type-picker-icons img:first-child {margin-left:0;}
    .type-dialog {width:min(440px,calc(100% - 28px));padding:0;border:1px solid #d9ddc9;border-radius:22px;background:#fffdf8;color:var(--ink);box-shadow:0 24px 70px #24351f45;}
    .type-dialog::backdrop {background:#20301f70;backdrop-filter:blur(3px);}
    .type-dialog-inner {padding:21px;}
    .type-dialog-header {display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:8px;}
    .type-dialog h2 {margin:0;color:#38583a;font-size:20px;}
    .type-dialog-description {margin:0 0 17px;color:#778276;font-size:13px;}
    .type-dialog-close {width:36px;height:36px;border:0;border-radius:50%;background:#f0f1e8;color:#5f6c5b;font-size:21px;cursor:pointer;}
    .type-options {display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .type-option {position:relative;display:flex;align-items:center;gap:10px;min-height:82px;padding:10px;border:2px solid #e1e5d9;border-radius:15px;background:#fff;color:#596653;font-size:14px;font-weight:800;cursor:pointer;}
    .type-option:has(input:checked) {border-color:#83a86d;background:#f4f8ed;box-shadow:0 0 0 2px #83a86d24;}
    .type-option input {width:18px;height:18px;margin-left:auto;accent-color:#64884f;}
    .type-option img {width:43px;height:59px;object-fit:contain;}
    .type-dialog-footer {display:flex;justify-content:flex-end;margin-top:17px;}
    .type-dialog-done {min-width:105px;height:42px;border:0;border-radius:12px;background:#537a4c;color:white;font-weight:850;cursor:pointer;}
    .target-input {width:69px;height:40px;padding:0 8px;border:1px solid #dcded1;border-radius:11px;background:#f8f8f1;color:var(--ink);text-align:center;font-weight:850;outline:none;}
    .target-input:focus {border-color:#8caa75;box-shadow:0 0 0 3px #b7cf9d55;}
    .toggle {display:flex;align-items:center;gap:7px;padding:9px 11px;border:1px solid #e1e2d7;border-radius:11px;color:#6d776a;font-size:12px;font-weight:750;cursor:pointer;}
    .toggle input{accent-color:#64884f}
    .buttons {display:flex;justify-content:flex-end;align-items:center;gap:9px;}
    .btn {height:45px;padding:0 18px;border:0;border-radius:13px;cursor:pointer;font-weight:850;transition:transform .13s,box-shadow .13s,background .13s;}
    .btn:hover {transform:translateY(-2px)}.btn:active{transform:translateY(1px)}
    .btn-primary {background:#537a4c;color:white;box-shadow:0 4px 0 #3e623c;}
    .btn-primary:hover{background:#608959;box-shadow:0 5px 0 #3e623c}
    .btn-secondary {background:#f1f1e8;color:#596653;}
    .hint {margin:11px 5px 0;color:#778276;font-size:12px;text-align:center;}
    .sparkle {position:absolute;z-index:7;font-size:22px;pointer-events:none;animation:pop 850ms ease-out forwards;}
    @keyframes pop {0%{opacity:0;transform:translateY(10px) scale(.4)}25%{opacity:1;transform:translateY(-10px) scale(1.25)}100%{opacity:0;transform:translateY(-52px) scale(.7)}}
    @media(max-width:620px){
      .page{width:100%;padding:calc(14px + env(safe-area-inset-top)) 12px calc(22px + env(safe-area-inset-bottom))}
      header{flex-direction:column;align-items:stretch;gap:9px;margin-bottom:12px}
      .brand{gap:9px;min-width:0}
      .brand-mark{width:38px;height:38px;flex:0 0 38px;font-size:23px}
      .eyebrow{font-size:10px;letter-spacing:.12em}
      h1{font-size:clamp(18px,5.5vw,25px)}
      .score{align-self:flex-end;padding:6px 11px;font-size:13px}
      .intro{font-size:12px;margin-bottom:12px}
      .playfield{height:clamp(360px,110vw,420px);min-height:360px}
      .scene-label{top:14px}
      .equation-card{top:65px;gap:clamp(5px,2vw,8px);padding:9px 12px}
      .equation-card .num{min-width:clamp(30px,10vw,38px);font-size:clamp(23px,7vw,30px)}
      .equation-card .blank{min-width:48px;width:52px;height:46px;font-size:26px}
      .feedback{top:158px;max-width:92%;text-align:center}
      .monster-wrap{bottom:58px;width:clamp(145px,44vw,175px);height:175px}
      .crew{bottom:68px;width:calc(100vw - 30px);height:180px}
      .wrong-state .crew{bottom:68px}
      .pikmin{width:clamp(48px,14vw,62px);height:clamp(70px,20vw,88px)}
      .ground{height:68px}
      .flower{bottom:65px}.f2,.f4{bottom:69px}
      .controls{grid-template-columns:1fr;padding:14px 10px 16px;gap:13px}
      .left-controls{justify-content:center;gap:7px}
      .target-control{font-size:12px;gap:6px}
      .target-input{width:58px;height:38px}
      .toggle{padding:8px 9px;font-size:11px}
      .buttons{justify-content:center;gap:8px}
      .btn{flex:1;min-width:0;max-width:170px;padding:0 10px;font-size:13px}
      .hint{margin-top:9px}
    }
    @media(min-width:760px) and (any-pointer:coarse){
      .game{display:grid;grid-template-columns:minmax(0,1fr) 230px;align-items:stretch}
      .playfield{grid-column:1;grid-row:1}
      .controls{grid-column:1/-1;grid-row:2}
      .keypad{grid-column:2;grid-row:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:18px 14px;background:#fffdf8;border-left:1px solid #e7e4d7}
      .keypad-title{margin:0;color:#64715e;text-align:center;font-size:16px;font-weight:850}
      .keypad-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
      .keypad-grid button{min-width:0;min-height:58px;aspect-ratio:1.1;border:1px solid #dfe3d5;border-radius:15px;background:#f7f8ef;color:#324b31;font-size:26px;font-weight:900;box-shadow:0 3px 0 #d6dcc9;touch-action:manipulation}
      .keypad-grid button:active{transform:translateY(2px);box-shadow:0 1px 0 #d6dcc9;background:#e9f0dd}
      .keypad-grid .keypad-zero{grid-column:2}
      .keypad-grid .keypad-action{font-size:17px;background:#f1f1e8;color:#697363}
      .keypad-hint{margin:0;color:#879080;text-align:center;font-size:11px}
    }
    @media(min-width:621px) and (orientation:portrait){
      .playfield{height:clamp(460px,70vw,560px)}
      .equation-card .blank{width:46px;min-width:46px}
    }
    @media(max-width:620px) and (orientation:portrait){
      .playfield{height:clamp(390px,110vw,460px);min-height:390px}
      .equation-card .blank{width:44px;min-width:44px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand"><div class="brand-mark" aria-hidden="true">🌱</div><div><p class="eyebrow">PIKMIN × MATH TIME</p><h1>皮克敏減法大作戰</h1></div></div>
      <div class="score" aria-live="polite"><span>🌼</span> 答對 <b id="score">0</b> 題</div>
    </header>
    <p class="intro">算出還差幾隻皮克敏，就能一起把怪物壓扁！</p>

    <section class="game" aria-label="減法遊戲場景">
      <div class="playfield" id="playfield">
        <div class="sunlight"></div><div class="cloud"></div><div class="cloud two"></div>
        <div class="hill left"></div><div class="hill right"></div>
        <div class="scene-label"><span class="target-pill"></span><span id="sceneLabel">怪物需要 10 隻皮克敏</span></div>
        <div class="equation-card" aria-label="減法算式">
          <span class="num" id="targetNumber">10</span><span class="minus">−</span><span class="num" id="firstNumber">2</span><span class="minus">=</span>
          <input class="blank" id="answer" type="number" inputmode="numeric" min="0" aria-label="答案" autocomplete="off" />
        </div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="monster-wrap" id="monsterWrap"><img class="monster" src="assets/bulborb.webp" alt="大眼怪物" /><span class="monster-number" id="monsterNumber">10</span></div>
        <div class="crew" id="crew" aria-label="已到場的皮克敏"></div>
        <div class="flower f1">🌼</div><div class="flower f2">🌱</div><div class="flower f3">🌸</div><div class="flower f4">🌿</div>
        <div class="ground"></div>
      </div>
      <div class="controls">
        <div class="left-controls">
          <label class="target-control" for="targetInput">怪物數字 <input id="targetInput" class="target-input" type="number" inputmode="numeric" enterkeyhint="done" min="2" max="30" value="10" aria-label="自訂怪物數字" /></label>
          <div class="type-picker"><span class="type-picker-title">皮克敏</span><button id="openTypePicker" class="type-picker-button" type="button" aria-haspopup="dialog" aria-controls="typeDialog"><span id="selectedTypeIcons" class="type-picker-icons" aria-hidden="true"></span><span id="selectedTypeSummary">全部型態</span><span aria-hidden="true">⌄</span></button></div>
          <label class="toggle"><input id="randomTarget" type="checkbox" /> 每題隨機數字（≤10）</label>
          <label class="toggle"><input id="autoNext" type="checkbox" checked /> 答對自動下一題</label>
        </div>
        <div class="buttons"><button id="newQuestion" class="btn btn-secondary" type="button">換一題 ↻</button><button id="checkAnswer" class="btn btn-primary" type="button">送出答案</button></div>
      </div>
      <dialog id="typeDialog" class="type-dialog" aria-labelledby="typeDialogTitle">
        <div class="type-dialog-inner">
          <div class="type-dialog-header"><h2 id="typeDialogTitle">選擇皮克敏</h2><button id="closeTypePicker" class="type-dialog-close" type="button" aria-label="關閉">×</button></div>
          <p class="type-dialog-description">勾選想出現的型態；選多種時會隨機混合。</p>
          <div id="pikminTypeChoices" class="type-options"></div>
          <div class="type-dialog-footer"><button id="doneTypePicker" class="type-dialog-done" type="button">完成</button></div>
        </div>
      </dialog>
      <aside class="keypad" id="keypad" aria-label="數字鍵盤" aria-hidden="true">
        <h2 class="keypad-title">數字鍵盤</h2>
        <div class="keypad-grid">
          <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
          <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
          <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
          <button class="keypad-action" type="button" data-key-action="backspace" aria-label="刪除一位">⌫</button><button class="keypad-zero" type="button" data-digit="0">0</button><button class="keypad-action" type="button" data-key-action="clear">清除</button>
        </div>
        <p class="keypad-hint">按數字輸入答案</p>
      </aside>
    </section>
    <p class="hint">小提示：先看怪物要幾隻，再減掉已經出發的皮克敏。</p>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const targetInput = $('targetInput');
    const randomTarget = $('randomTarget');
    const autoNext = $('autoNext');
    const answer = $('answer');
    const crew = $('crew');
    const playfield = $('playfield');
    const keypad = $('keypad');
    const pikminTypeChoices = $('pikminTypeChoices');
    const typeDialog = $('typeDialog');
    const keypadMedia = window.matchMedia('(min-width: 760px) and (any-pointer: coarse)');
    const PIKMIN_TYPES = [
      { id: 'red', name: '紅色', src: 'assets/pikmin.webp' },
      { id: 'glow', name: '發光', src: 'assets/glow-pikmin-2x.webp' },
      { id: 'rock', name: '岩石', src: 'assets/rock-pikmin-2x.webp' },
      { id: 'purple', name: '紫色', src: 'assets/purple-pikmin-2x.webp' },
      { id: 'winged', name: '羽翅', src: 'assets/winged-pikmin-2x.webp' },
      { id: 'blue', name: '藍色', src: 'assets/blue-pikmin-2x.webp' },
      { id: 'ice', name: '冰', src: 'assets/ice-pikmin-2x.webp' },
      { id: 'yellow', name: '黃色', src: 'assets/yellow-pikmin-2x.webp' },
      { id: 'white', name: '白色', src: 'assets/white-pikmin-2x.webp' },
    ];
    let target = 10;
    let already = 2;
    let solved = false;
    let score = 0;
    let replaceNextKey = false;

    function syncKeypadMode() {
      const visible = keypadMedia.matches;
      document.body.classList.toggle('keypad-mode', visible);
      keypad.setAttribute('aria-hidden', String(!visible));
      answer.setAttribute('inputmode', visible ? 'none' : 'numeric');
    }

    syncKeypadMode();
    window.addEventListener('resize', syncKeypadMode, {passive:true});
    window.addEventListener('orientationchange', syncKeypadMode, {passive:true});
    if (screen.orientation?.addEventListener) screen.orientation.addEventListener('change', syncKeypadMode);
    keypadMedia.addEventListener('change', syncKeypadMode);

    function shuffle(items) {
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    function renderPikminTypeChoices() {
      pikminTypeChoices.replaceChildren();
      PIKMIN_TYPES.forEach((type) => {
        const label = document.createElement('label');
        label.className = 'type-option';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = type.id;
        checkbox.checked = true;
        checkbox.setAttribute('aria-label', `${type.name}皮克敏`);
        const icon = document.createElement('img');
        icon.src = type.src;
        icon.alt = '';
        label.append(icon, document.createTextNode(type.name), checkbox);
        pikminTypeChoices.append(label);
      });
      updatePikminTypeSummary();
    }

    function getSelectedPikminTypes() {
      const selectedIds = new Set([...pikminTypeChoices.querySelectorAll('input:checked')].map((input) => input.value));
      return PIKMIN_TYPES.filter((type) => selectedIds.has(type.id));
    }

    function updatePikminTypeSummary() {
      const selected = getSelectedPikminTypes();
      const icons = $('selectedTypeIcons');
      icons.replaceChildren();
      selected.forEach((type) => {
        const icon = document.createElement('img');
        icon.src = type.src;
        icon.alt = '';
        icons.append(icon);
      });
      $('selectedTypeSummary').textContent = selected.length === PIKMIN_TYPES.length ? '全部型態' : selected.map((type) => type.name).join('、');
    }

    function refreshPikminTypes() {
      updatePikminTypeSummary();
      drawPikmin(solved ? target : already);
    }

    function drawPikmin(count) {
      crew.replaceChildren();
      const availableTypes = getSelectedPikminTypes();
      if (availableTypes.length === 0) return;
      const types = Array.from({length: count}, () => availableTypes[Math.floor(Math.random() * availableTypes.length)]);
      if (count >= availableTypes.length) {
        availableTypes.forEach((type, index) => { types[index] = type; });
        shuffle(types);
      }
      const presentTypes = [...new Set(types.map((type) => type.name))];
      crew.setAttribute('aria-label', `${count} 隻皮克敏${presentTypes.length ? `：${presentTypes.join('、')}型態` : ''}`);

      for (let i = 0; i < count; i++) {
        const img = document.createElement('img');
        const type = types[i];
        img.src = type.src; img.alt = ''; img.dataset.pikminType = type.id;
        img.className = 'pikmin'; img.style.setProperty('--i', i);
        const angle = (i / count) * Math.PI * 2 + (Math.random() - .5) * .6;
        const radius = .28 + Math.random() * .58;
        const x = Math.max(3, Math.min(82, 50 + Math.cos(angle) * 46 * radius));
        const y = 8 + Math.random() * 40;
        const groundX = count === 1 ? 42 : 4 + (i / (count - 1)) * 82;
        img.style.left = `${x}%`; img.style.top = `${y}%`;
        img.style.setProperty('--ground-x', `${groundX}%`);
        crew.append(img);
      }
    }

    function chooseTarget() {
      const entered = Math.floor(Number(targetInput.value));
      target = randomTarget.checked ? 3 + Math.floor(Math.random() * 8) : Math.min(30, Math.max(2, entered || 10));
      already = 1 + Math.floor(Math.random() * target);
      replaceNextKey = false;
      solved = false;
      playfield.classList.remove('run');
      playfield.classList.remove('wrong-state');
      $('feedback').className = 'feedback'; $('feedback').textContent = '';
      $('targetNumber').textContent = target;
      $('firstNumber').textContent = already;
      $('monsterNumber').textContent = target;
      $('sceneLabel').textContent = `怪物需要 ${target} 隻皮克敏`;
      answer.value = ''; answer.disabled = false;
      $('checkAnswer').disabled = false;
      $('checkAnswer').textContent = '送出答案';
      drawPikmin(already);
      answer.focus({preventScroll:true});
    }

    function sparkleBurst() {
      const marks = ['✦','✨','🌟','✧'];
      for (let i=0;i<10;i++) {
        const spark = document.createElement('span'); spark.className='sparkle'; spark.textContent=marks[i%marks.length];
        spark.style.left = `${35 + Math.random()*30}%`; spark.style.top = `${35 + Math.random()*38}%`;
        spark.style.animationDelay = `${Math.random()*250}ms`; playfield.append(spark);
        setTimeout(()=>spark.remove(),1200);
      }
    }

    function submit() {
      if (solved) { chooseTarget(); return; }
      const val = answer.value.trim();
      const feedback = $('feedback');
      if (val === '') { feedback.textContent='先填上答案，皮克敏準備好了！'; feedback.className='feedback show'; answer.focus(); return; }
      if (Number(val) === target - already) {
        solved = true; score++; $('score').textContent=score;
        playfield.classList.remove('wrong-state');
        feedback.textContent='答對了！皮克敏衝呀——'; feedback.className='feedback show';
        answer.value = target - already;
        answer.disabled = !autoNext.checked;
        $('checkAnswer').textContent='再玩一題 →';
        drawPikmin(target);
        requestAnimationFrame(()=>playfield.classList.add('run'));
        sparkleBurst();
        if (autoNext.checked) {
          setTimeout(() => {
            if (autoNext.checked && solved) {
              chooseTarget();
              requestAnimationFrame(() => answer.focus({preventScroll:true}));
            }
          }, 850);
        } else {
          requestAnimationFrame(()=>$('checkAnswer').focus({preventScroll:true}));
        }
      } else {
        replaceNextKey = true;
        playfield.classList.add('wrong-state');
        feedback.textContent=`再想一下：${target} 隻裡面已經有 ${already} 隻喔。`;
        feedback.className='feedback show wrong';
        requestAnimationFrame(()=>{
          answer.focus({preventScroll:true});
          answer.select();
        });
      }
    }

    renderPikminTypeChoices();
    pikminTypeChoices.addEventListener('change', (event)=>{
      const selected = pikminTypeChoices.querySelectorAll('input:checked');
      if (selected.length === 0) {
        event.target.checked = true;
        return;
      }
      refreshPikminTypes();
    });
    $('openTypePicker').addEventListener('click', () => typeDialog.showModal());
    $('closeTypePicker').addEventListener('click', () => typeDialog.close());
    $('doneTypePicker').addEventListener('click', () => typeDialog.close());
    typeDialog.addEventListener('click', (event) => { if (event.target === typeDialog) typeDialog.close(); });
    $('checkAnswer').addEventListener('click', submit);
    $('newQuestion').addEventListener('click', chooseTarget);
    answer.addEventListener('input', ()=>{
      if (solved) {
        answer.value = target - already;
        return;
      }
      replaceNextKey = false;
      const entered = answer.value.trim();
      const digitsNeeded = String(target - already).length;
      if (entered.length >= digitsNeeded && entered.length > 0) submit();
    });
    keypad.addEventListener('click', (event)=>{
      const button = event.target.closest('button');
      if (!button || !keypadMedia.matches || solved || answer.disabled) return;
      if (button.dataset.digit !== undefined) {
        const digitsNeeded = String(target - already).length;
        if (replaceNextKey || answer.value.length >= digitsNeeded) answer.value = '';
        answer.value += button.dataset.digit;
        answer.dispatchEvent(new Event('input', {bubbles:true}));
      } else if (button.dataset.keyAction === 'backspace') {
        answer.value = answer.value.slice(0, -1);
        answer.dispatchEvent(new Event('input', {bubbles:true}));
      } else if (button.dataset.keyAction === 'clear') {
        answer.value = '';
        replaceNextKey = false;
      }
      if (!answer.disabled) answer.focus({preventScroll:true});
    });
    targetInput.addEventListener('change', ()=>{ if(!randomTarget.checked) chooseTarget(); });
    randomTarget.addEventListener('change', ()=>{ targetInput.disabled=randomTarget.checked; chooseTarget(); });
    targetInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') { e.preventDefault(); chooseTarget(); } });
    chooseTarget();
  </script>
</body>
</html>
